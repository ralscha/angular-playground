# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
# Temporarily hold TypeScript below 7 for Angular projects; remove the ignore rule when compatible.
version: 2
updates:
- package-ecosystem: npm
  directories:
  - /clickoutside
  - /communication
  - /control-access
  - /cooldown
  - /deferred
  - /directive
  - /dynamic-checkbox
  - /exportas
  - /grid-list-toggle
  - /host-animation
  - /list-draggable
  - /list-keyboard
  - /modal
  - /onetime
  - /resizable-sidebar
  - /session-timer
  - /show-more
  - /skeleton
  - /styles
  - /svg
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch-a:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    versions:
    - '>=7.0.0'
- package-ecosystem: npm
  directories:
  - /toast
  - /validation
  - /view-content
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch-b:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    versions:
    - '>=7.0.0'
